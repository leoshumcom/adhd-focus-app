name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: |
          rm -f package-lock.json
          npm install --no-package-lock --legacy-peer-deps

      - name: Build with OpenNext
        run: npx @opennextjs/cloudflare build
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Prepare Pages output
        run: |
          cp .open-next/worker.js .open-next/_worker.js
          ls -la .open-next/

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy .open-next --project-name=adhd-focus-app --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      - name: Run D1 migrations
        run: npx wrangler d1 execute adhd-focus-db --remote --file=migrations/001_initial.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
