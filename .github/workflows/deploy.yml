name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: |
          rm -f package-lock.json
          npm install --no-package-lock --legacy-peer-deps

      - name: Build with OpenNext
        run: npx @opennextjs/cloudflare build
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Prepare pages-deploy structure
        run: |
          # Move assets to deploy root, keep worker at root as _worker.js
          rm -rf pages-deploy
          mkdir -p pages-deploy
          # Copy all assets (Next.js static files) to root
          cp -r .open-next/assets/* pages-deploy/
          # Copy worker as _worker.js
          cp .open-next/worker.js pages-deploy/_worker.js
          # Inject static file passthrough into _worker.js
          node -e "
const fs = require('fs');
let c = fs.readFileSync('pages-deploy/_worker.js','utf8');
const old = '// - \`Request\`s are handled by the Next server\n            const reqOrResp = await middlewareHandler(request, env, ctx);';
const next = '// - Serve static assets\n            try { const sr = await env.ASSETS.fetch(new URL(request.url)); if (sr.status < 400) return sr; } catch {}\n            // - \`Request\`s are handled by the Next server\n            const reqOrResp = await middlewareHandler(request, env, ctx);';
if (c.includes(old)) { c = c.replace(old, next); fs.writeFileSync('pages-deploy/_worker.js',c,'utf8'); console.log('Patched OK'); }
else { console.log('WARN: pattern not found, using original'); }
"

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy pages-deploy --project-name=adhd-focus-app --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      - name: Run D1 migrations
        run: |
          npx wrangler d1 execute adhd-focus-db --remote --file=migrations/001_initial.sql || true
          npx wrangler d1 execute adhd-focus-db --remote --file=migrations/002_seed_admin.sql || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
