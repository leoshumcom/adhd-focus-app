name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: |
          rm -f package-lock.json
          npm install --no-package-lock --legacy-peer-deps

      - name: Build with OpenNext
        run: npx @opennextjs/cloudflare build
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Create _worker.js with static file handling
        run: |
          cp .open-next/worker.js .open-next/_worker.js
          # Inject static asset serving via env.ASSETS before middleware handler
          python3 -c "
import re, sys
with open('.open-next/_worker.js', 'r') as f:
    content = f.read()
# Insert ASSETS check before middleware handler
old = '''// - `Request`s are handled by the Next server
            const reqOrResp = await middlewareHandler(request, env, ctx);'''
new = '''// - Serve static assets from Pages (CSS, JS, images, etc)
            const staticUrl = new URL(request.url);
            if (staticUrl.pathname.startsWith('/_next/') ||
                staticUrl.pathname.startsWith('/favicon') ||
                staticUrl.pathname.startsWith('/icon-') ||
                staticUrl.pathname === '/manifest.json') {
              const staticResp = await env.ASSETS.fetch(staticUrl);
              if (staticResp.status < 400) {
                return staticResp;
              }
            }
            // - `Request`s are handled by the Next server
            const reqOrResp = await middlewareHandler(request, env, ctx);'''
content = content.replace(old, new)
with open('.open-next/_worker.js', 'w') as f:
    f.write(content)
print('Static file serving added')
"

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy .open-next --project-name=adhd-focus-app --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      - name: Run D1 migrations
        run: npx wrangler d1 execute adhd-focus-db --remote --file=migrations/001_initial.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
